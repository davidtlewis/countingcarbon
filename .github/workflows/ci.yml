name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: countingcarbon
          POSTGRES_USER: countingcarbon
          POSTGRES_PASSWORD: countingcarbon
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://countingcarbon:countingcarbon@localhost:5432/countingcarbon
      SECRET_KEY: ci-secret-key-not-for-production
      DJANGO_SETTINGS_MODULE: countingcarbon.settings.dev
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Lint
        run: uv run ruff check . --exclude .venv

      - name: Format check
        run: uv run ruff format . --exclude .venv --check

      - name: Run migrations
        run: uv run python manage.py migrate

      - name: Seed catalogue
        run: uv run python manage.py load_catalogue

      - name: Run tests with coverage
        run: uv run pytest --cov=engine --cov=dashboard --cov=entries --cov=accounts --cov-report=term-missing
