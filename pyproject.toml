[project]
name = "countingcarbon"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "dj-database-url>=3.1.2",
    "django>=6.0.6",
    "django-allauth>=65.18.0",
    "gunicorn>=26.0.0",
    "psycopg2-binary>=2.9.12",
    "python-dotenv>=1.2.2",
    "whitenoise>=6.12.0",
]

[dependency-groups]
dev = [
    "factory-boy>=3.3",
    "pre-commit>=4.6.0",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "pytest-django>=4.9",
    "ruff>=0.15.17",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "countingcarbon.settings.dev"
addopts = "--tb=short -q"
