{% load entries_extras %}
<tr id="entry-{{ entry.id }}" class="entry-row--editing">
  <td>{{ entry.period_label }}</td>
  {% for item in slice.items %}
  <td class="num">
    <input type="number"
           name="{{ item.key }}"
           value="{{ entry.inputs|dict_get:item.key|default:'' }}"
           min="0" step="any" placeholder="0"
           aria-label="{{ item.label }}">
  </td>
  {% endfor %}
  <td class="num">{{ entry.result_kg|floatformat:2 }}</td>
  <td class="entry-actions">
    <button class="btn btn--sm btn--primary"
            hx-post="{% url 'entries:edit_entry' entry.id %}"
            hx-include="closest tr"
            hx-target="#entry-{{ entry.id }}"
            hx-swap="outerHTML">Save</button>
    <button class="btn btn--sm"
            hx-get="{% url 'entries:entry_row' entry.id %}"
            hx-target="#entry-{{ entry.id }}"
            hx-swap="outerHTML"
            type="button">Cancel</button>
  </td>
</tr>
{% if form_errors %}
<tr class="entry-row--errors" id="entry-{{ entry.id }}-errors">
  <td colspan="{{ slice.items|length|add:3 }}">
    <ul class="form-errors">
      {% for key, msg in form_errors.items %}<li>{{ msg }}</li>{% endfor %}
    </ul>
  </td>
</tr>
{% endif %}
